name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Allow unprivileged user namespaces (Lab sandbox uses `unshare -rn`)
        # Ubuntu 24.04 runners block them via AppArmor; without this the sandboxed
        # subprocess dies with "unshare failed: Operation not permitted".
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tests
        run: uv run pytest -q
