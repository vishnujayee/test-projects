# TriVec Lab loop configuration. LLM calls go through src/trivec/lab/llm.py only.
llm:
  backend: ollama              # ollama | anthropic | openai_compatible | fake
  model: qwen2.5:3b            # already installed here, small enough for ~6 GB RAM
  base_url: http://localhost:11434
  num_ctx: 8192                # Ollama's small default silently cuts long prompts
  api_key_env: null            # e.g. ANTHROPIC_API_KEY for backend: anthropic (never the key itself)
  max_tokens: 4096
  timeout_s: 900
  temperature: 0.2

bench_config: configs/scifact_minilm.yaml        # dataset the lab experiments run on
holdout_configs: [configs/nfcorpus_minilm.yaml]  # used only for reproduction runs
seed: 0
search_mode: asymmetric_flat

sandbox:
  timeout_s: 1200

librarian:
  enabled: true
  embedder: sentence-transformers/all-MiniLM-L6-v2   # or "hash" to work fully offline
  max_papers_per_query: 8
  queries:
    - ternary quantization embeddings retrieval
    - binary embeddings similarity search
    - product quantization nearest neighbor search
    - vector compression dense retrieval
    - rotation quantization approximate nearest neighbor

paths:
  lab_dir: lab
  results_dir: results
  reports_dir: reports
  docs_dir: docs
