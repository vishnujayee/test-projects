name: arguana_multiview
dataset: arguana
model:
  name: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
k: 10
seeds: [0, 1, 2]   # the rotation and PQ use the seed, so three seeds show their spread
warmup: 20
quantizers:
  - {name: pq, params: {m: 192}}   # equal-memory baseline for the 200-byte variants
  - {name: rternary, params: {alpha: 0.7, rotate: false, residual: false}}   # must equal plain ternary
  - {name: rternary, params: {alpha: 0.7, rotate: true, residual: false}}
  - {name: rternary, params: {alpha: 0.7, rotate: false, residual: true}}
  - {name: rternary, params: {alpha: 0.7, rotate: true, residual: true}}
