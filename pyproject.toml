[project]
name = "trivec"
version = "0.0.1"
description = "TriVec Lab: benchmark and agentic research lab for extreme vector compression (ternary embeddings)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "huggingface-hub>=0.24",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "psutil>=6.0",
]

[tool.uv]
# CPU-only torch wheels: far smaller than the default CUDA builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
trivec = "trivec.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trivec"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These two files mostly build long human-readable strings (tables, log lines).
"src/trivec/report.py" = ["E501"]
"src/trivec/bench.py" = ["E501"]
"src/trivec/claims.py" = ["E501"]
"src/trivec/break_tests.py" = ["E501"]
"src/trivec/lab/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "sentence_transformers", "sentence_transformers.*", "matplotlib", "matplotlib.*", "psutil", "anthropic"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
